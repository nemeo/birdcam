substitutions:
  device_name: birdcam
  friendly_name: "Birdcam Nichoir"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32cam
  framework:
    type: arduino

# --- Réseau ---
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # IP fixe recommandée : le nichoir est souvent en bord de portée Wi-Fi
  manual_ip:
    static_ip: 192.168.1.50      # <-- à adapter à ton réseau
    gateway: 192.168.1.1
    subnet: 255.255.255.0
  # Fallback hotspot si la connexion échoue (utile pour debug sur site)
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_password

captive_portal:

logger:
  level: INFO

# API native Home Assistant (découverte auto)
api:
  encryption:
    key: !secret api_encryption_key

ota:
  platform: esphome
  password: !secret ota_password

# --- Caméra (module AI-Thinker ESP32-CAM) ---
esp32_camera:
  name: "${friendly_name} Caméra"
  external_clock:
    pin: GPIO0
    frequency: 20MHz
  i2c_pins:
    sda: GPIO26
    scl: GPIO27
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  power_down_pin: GPIO32
  resolution: 800x600       # compromis qualité/bande passante Wi-Fi, ajustable
  jpeg_quality: 10          # 10-63, plus bas = meilleure qualité / plus de débit
  max_framerate: 10 fps
  idle_framerate: 0.1 fps

# --- Capteur de mouvement PIR (déclenche la détection de présence) ---
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO13
      inverted: false
    name: "${friendly_name} Présence (PIR)"
    device_class: motion
    filters:
      - delayed_off: 5s     # anti-rebond, ajuster selon le capteur utilisé

# --- LED IR intégrée (vision nocturne dans le nichoir) ---
output:
  - platform: gpio
    pin: GPIO4
    id: ir_led_output

light:
  - platform: binary
    name: "${friendly_name} LED IR"
    output: ir_led_output
